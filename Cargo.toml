[package]
name = "vademecum"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "A modern man for reading Markdown: a themeable terminal Markdown reader with wikilink navigation."
repository = "https://github.com/otaviocc/vademecum"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "terminal", "tui", "pager", "viewer"]
categories = ["command-line-utilities", "text-processing"]
# Files about developing vademecum rather than using it. `syntaxes/` and
# `themes/` stay: the build script and `include_str!` need them to build the
# crate at all. `tests/` stays too, so a vendored copy can be verified.
exclude = ["CLAUDE.md", "Makefile", "rustfmt.toml", ".github/", ".cargo/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
notify = "8"
notify-debouncer-mini = "0.6"
open = "5"
pulldown-cmark = "0.13"
ratatui = { version = "0.30", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
similar = { version = "2", default-features = false, features = ["text"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
thiserror = "2"
toml = "1"
unicode-width = "0.2"

# Bakes `syntaxes/` into a binary pack; see build.rs. The same crate and version
# as the runtime dependency, so there is one syntect in the lock file.
[build-dependencies]
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "pty", "stdio", "termios"] }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
