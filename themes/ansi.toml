# The default theme, and the base every partial theme file merges over.
#
# Nothing here asserts a color the terminal has not already chosen: the 16 ANSI
# names are whatever the reader's scheme says they are, and `reset` is the
# terminal's own foreground and background. The one exception is `subtle`,
# the background of the cursor line and of code blocks, which `reset` would
# make invisible.
name = "ansi"
syntax_theme = "base16-ocean.dark"

[palette]
background           = "reset"
foreground           = "reset"
muted                = "dark_gray"
muted_text           = "gray"
subtle               = "dark_gray"
selection_background = "blue"
selection_foreground = "white"
error                = "red"
success              = "green"
warning              = "yellow"
accent               = "cyan"
chrome               = "cyan"
highlight            = "blue"
notice               = "magenta"

# Code is styled by foreground alone. `dark_gray` is ANSI bright black, which
# most terminal schemes render as a mid grey: as the background of inline code
# and whole code blocks it reads as a washed-out slab, and it collided with the
# cursor line, which uses the same slot — so the bar vanished exactly where it
# was most needed. `subtle` is the cursor line's alone now.
[elements.inline_code]
fg = "warning"
bg = "none"

[elements.code_block]
fg = "foreground"
bg = "none"

[elements.code_block_lang]
fg = "muted_text"
bg = "none"

# `background` is `reset` here, and `reset` as a *foreground* means the
# terminal's foreground — so the inversion these want never happened and a match
# painted default-on-yellow. Black is the one foreground that reads on both.
[elements.search_match]
fg = "black"
bg = "warning"

[elements.search_current]
fg = "black"
bg = "notice"
